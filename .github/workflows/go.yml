# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  # push:
  #   branches: [ "main" ]
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/huski-inc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'

      - name: Install dependencies
        run: go mod download

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1.3.1
        with:
          version: 'latest'
          install-go: false
          checks: 'all'

      - name: Build
        run: go build -v ./...

      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Enforce coverage
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.txt | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v total="$total" 'BEGIN { if (total < 85) exit 1 }'
